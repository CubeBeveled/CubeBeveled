<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="assets/global.css" />
    <link rel="stylesheet" type="text/css" href="assets/index.css" />
    <link rel="icon" type="image/png" href="assets/icons/round-icon.png" />

    <title>Beveled Cube</title>
  </head>

  <body>
    <div class="outline profile_container">
      <img src="assets/icons/round-icon.png" class="profile_image" />
      <div class="profile_text">
        <h1 class="glowing_title">Beveled Cube</h1>
        welcome to my site!
      </div>

      <div class="links_container" id="links_container"></div>
    </div>

    <div class="supercontainer outline">
      <h1 class="title">Projects</h1>
      <div id="projects_container"></div>
    </div>

    <div class="supercontainer outline">
      <h1 class="section-title">Contact</h1>
      <div class="contact_container">
        <div>
          <img src="assets/icons/discord.svg" class="inline-icon" /> Discord:
          <span class="short-code">beveledcube</span>
        </div>
        <div>
          <img src="assets/icons/stoat.svg" class="inline-icon" />
          <a href="https://stoat.chat/">Stoat</a>:
          <span class="short-code">beveledcube#0622</span>
        </div>
        <div>
          <img src="assets/icons/signal.svg" class="inline-icon" />
          Signal:
          <span class="short-code">BeveledCube.01</span>
        </div>
      </div>
    </div>
  </body>

  <script>
    window.va =
      window.va ||
      function () {
        (window.vaq = window.vaq || []).push(arguments);
      };
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    const links = [
      {
        name: "Disroot Git",
        description: "BeveledCube",
        target: "https://git.disroot.org/BeveledCube/",
        icon: "assets/icons/disroot.png",
        additionalImageClasses: [],
      },
      {
        name: "GitHub",
        description: "CubeBeveled",
        target: "https://github.com/CubeBeveled/",
        icon: "assets/icons/github.svg",
        additionalImageClasses: [],
      },
    ];

    const projects = [
      {
        name: "Overseer",
        description: "Discord chatbridge and stats bot",
        target: "https://top.gg/bot/1086580917608402984",
        image: "assets/icons/projects/overseer.png",
        additionalImageClasses: ["overseer_icon"],
      },
      {
        name: "Toolbox",
        description: "Discord utility bot",
        target: "https://top.gg/bot/1229139305109393621",
        image: "assets/icons/projects/toolbox.png",
        additionalImageClasses: ["toolbox_icon"],
      },
      {
        name: "Statbot",
        description: "Stoat statbot",
        target: "https://stoat.chat/bot/01JXG6Z0V7TZ774ZW4YP8PWP7M",
        image: "assets/icons/projects/statbot.png",
        additionalImageClasses: [],
      },
      {
        name: "Nihilium",
        description: "Minecraft server",
        target: "https://nihilium.org/",
        image: "assets/icons/projects/nihilium.webp",
        additionalImageClasses: [],
      },
      {
        name: "Summerhosts",
        description: "A wiki built with vitepress",
        target: "https://summerhosts.netlify.app/",
        image: "assets/icons/projects/summerhosts.svg",
        additionalImageClasses: [],
      },
    ];

    const linksContainer = document.getElementById("links_container");
    links.forEach((s) => {
      const linkElement = document.createElement("a");
      linkElement.href = s.target;
      linkElement.target = "_blank";
      linkElement.classList.add("links-container");

      // Create & style the image
      const linkImageElement = document.createElement("img");
      linkImageElement.src = s.icon;
      linkImageElement.classList.add("links-icon");

      s.additionalImageClasses.forEach((c) =>
        linkImageElement.classList.add(c),
      );

      // Create the text element and its children
      const linkTextElement = document.createElement("div");
      linkTextElement.classList.add("links-text");

      const projectTitleElement = document.createElement("strong");
      projectTitleElement.innerText = s.name;

      const projectDescriptionElement = document.createElement("dim");
      projectDescriptionElement.innerText = s.description;

      linkTextElement.appendChild(projectTitleElement);
      linkTextElement.appendChild(projectDescriptionElement);

      linkElement.appendChild(linkImageElement);
      linkElement.appendChild(linkTextElement);
      linksContainer.appendChild(linkElement);
    });

    const projectsContainer = document.getElementById("projects_container");
    projects.forEach((p) => {
      const projectElement = document.createElement("a");

      projectElement.href = p.target;
      projectElement.target = "_blank";
      projectElement.classList.add("project_container");

      // Create & style the image
      const projectImageElement = document.createElement("img");
      projectImageElement.src = p.image;
      projectImageElement.classList.add("project_icon");

      p.additionalImageClasses.forEach((c) =>
        projectImageElement.classList.add(c),
      );

      // Create the text element and its children
      const projectTextElement = document.createElement("div");
      projectTextElement.classList.add("project_text");

      const projectTitleElement = document.createElement("strong");
      projectTitleElement.innerText = p.name;

      const projectDescriptionElement = document.createElement("dim");
      projectDescriptionElement.innerText = p.description;

      projectTextElement.appendChild(projectTitleElement);
      projectTextElement.appendChild(projectDescriptionElement);

      projectElement.appendChild(projectImageElement);
      projectElement.appendChild(projectTextElement);
      projectsContainer.appendChild(projectElement);
    });
  </script>
</html>
